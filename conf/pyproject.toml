[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "illegal-mining-risk-detection"
version = "0.1.0"
description = "Clasificación binaria de minería ilegal (garimpo) en la Amazonía con CNNs sobre el dataset Amazonia Garimpo Binario (Brasil)."
requires-python = ">=3.10"

dependencies = [
    "pandas",
    "numpy",
    "matplotlib",
    "seaborn",
    "jupyter",
    "opencv-python-headless",
    "geopandas",
    "torch",
    "torchvision",
    "timm",
    "scikit-learn",
    "pillow",
    "tqdm",
]

[project.scripts]
garimpo = "src.cli:main"

[tool.setuptools.packages.find]
where = [".."]
include = ["src*"]
